[package]
name = "media-kit"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
authors = ["Sean Shaffer"]
description = "Pure-Rust media probing (duration, codecs, streams) for common containers, behind a small C ABI"
license = "MIT"
repository = "https://github.com/SeanShaffer88/MediaKit"
keywords = ["windows", "ffi"]
categories = ["os::windows-apis", "api-bindings"]

[lib]
name = "media_kit"
crate-type = ["cdylib", "rlib", "staticlib"]

# Zero dependencies by default. Win32 bindings are hand-declared in
# src/platform.rs with explicit #[link(name = "...")] on every extern
# block (advapi32 / shell32 / kernel32 / user32 as needed). Adding a
# dependency requires a written justification in the PR.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
